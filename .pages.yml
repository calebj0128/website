
media:
  input: site/assets/uploads
  output: /assets/uploads
  rename: safe

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: site/content/posts
    format: json
    filename: "{primary}.json"
    exclude: [".gitkeep"]
    view:
      fields: [title, category, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
      - name: category
        label: Category
        type: select
        options:
          values:
            - Mental Health
            - Philosophy
            - Recovery
            - Personal Reflections
            - Other
      - name: summary
        label: Short description
        type: text
      - name: published
        label: Published on website
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
        options:
          format: html
          switcher: true

  - name: sud_resources
    label: SUD Group Resources
    type: collection
    path: site/content/resources
    format: json
    filename: "{primary}.json"
    exclude: [".gitkeep"]
    view:
      fields: [title, topic, published]
      primary: title
    fields:
      - name: title
        label: Resource title
        type: string
        required: true
      - name: topic
        label: Topic
        type: select
        options:
          values:
            - Coping Skills
            - Relapse Prevention
            - Distress Tolerance
            - Relationships & Boundaries
            - Psychoeducation
            - Other
      - name: summary
        label: Short description
        type: text
      - name: audience
        label: Intended audience
        type: string
      - name: pdf
        label: Slides or handout PDF
        type: file
        options:
          extensions: [pdf]
          path: resources
      - name: published
        label: Published on website
        type: boolean
        default: false
